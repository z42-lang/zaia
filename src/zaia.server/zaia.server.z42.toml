[project]
name        = "zaia.server"
kind        = "lib"
version     = "0.1.0"
license     = "MIT"
description = "The HTTP application: WebApp, RequestContext, middleware, endpoints — a thin layer over Std.Net.Http."

# Only workspace siblings are declared here. Standard-library packages
# (Std.Net.Http, Std.Json, Std.Uri, …) are resolved from the SDK through
# `using` alone — naming one here makes z42c drop the workspace dist dirs
# from its search path and the sibling above stops resolving.
[dependencies]
"zaia.core" = "0.1.0"

[sources]
include = ["src/**/*.z42"]
