# zaia framework workspace — all packages compiled together so their inter-package
# dependencies resolve via workspace discovery.
#
#   cd packages && z42 build --workspace --release   → packages/dist/dist/zaia.*.zpkg
[workspace]
members = ["*"]

[workspace.build]
output_dir = "dist"

# Dependency order (z42c also topo-sorts):
#   core → renderer → web → app ; core → shared ; core → server
default-members = [
    "zaia.core",
    "zaia.renderer",
    "zaia.web",
    "zaia.app",
    "zaia.shared",
    "zaia.server",
]
