[project]
name = "zaia.web"
version = "0.1.0"
kind = "lib"

[sources]
include = ["src/**/*.z42"]

[dependencies]
"zaia.renderer" = "0.1.0"
"zaia.paint"    = "0.1.0"

# The DOM backend targets the VM DOM primitives added by the z42 change
# `add-wasm-dom-poc` (ships in a nightly SDK). It compiles today with stubbed
# operations so the framework stays buildable; the stubs throw at runtime.
